# Backing services for the integration tests. Without these, the tenancy and
# events tests skip — and those cover the two things most worth covering: RLS
# tenant isolation and the durable event bus.
#
#   docker compose -f docker-compose.test.yml up -d
#   TEST_POSTGRES_DSN='postgres://sdk:sdk@localhost:55432/sdk?sslmode=disable' \
#   TEST_REDIS_ADDR=localhost:56379 \
#   go test ./...

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdk
      POSTGRES_PASSWORD: sdk
      POSTGRES_DB: sdk
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdk"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
